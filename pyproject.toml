[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-astar"
version = "0.1.0"
description = "Comparing learned and ordinary heuristics for grid pathfinding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learned-astar = "learned_astar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ml = ["numpy>=2,<3", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
